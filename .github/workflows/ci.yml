name: Attendance API CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  validate:
    name: Test, Quality and Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run automated tests (Pytest)
        run: python -m pytest -v

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Run Ruff format checks
        run: ruff format --check .

      - name: Run Bandit security checks
        run: bandit -r app -ll

      - name: Audit Python dependencies (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Run Gitleaks secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t attendance-api:ci .

      - name: Run Trivy container image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "attendance-api:ci"
          format: "table"
          severity: "CRITICAL"
          exit-code: "0"
